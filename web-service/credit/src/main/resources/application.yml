server:
  port: 8082

spring:
  application:
    name: credit

  datasource:
    url: jdbc:h2:file:./creditdb;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  sql:
    init:
      mode: always

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  h2:
    console:
      enabled: true
      settings:
        web-allow-others: false
